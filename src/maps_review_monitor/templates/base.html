<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Songji 店家狀況{% endblock %}</title>
  <script>
    try {
      if (localStorage.getItem("songji.portal.show-similar-reviews.v1") === "false") {
        document.documentElement.classList.add("hide-highly-similar");
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='portal.css') }}">
</head>
<body>
  <header><nav><a href="/">Songji 店家狀況</a><a href="/analysis">全部店家分析</a></nav></header>
  <main>{% block content %}{% endblock %}</main>
  <aside class="analysis-progress" id="analysis-progress" hidden aria-live="polite">
    <strong id="analysis-stage">分析中</strong>
    <progress id="analysis-meter" max="100" value="0"></progress>
    <span id="analysis-percent">0%</span>
  </aside>
  <script src="{{ url_for('static', path='portal.js') }}" defer></script>
</body>
</html>
