[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maps-review-monitor"
version = "0.1.0"
description = "Monitor public Google Maps reviews and notify a Telegram group."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Jinja2>=3.1,<4",
  "Pillow>=10,<13",
  "playwright>=1.52,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
  "tzdata>=2025.2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
analysis = [
  "huggingface-hub>=0.30,<2",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
]

[project.scripts]
maps-review-monitor = "maps_review_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
