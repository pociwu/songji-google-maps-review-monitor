[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maps-review-monitor"
version = "0.1.0"
description = "Monitor public Google Maps reviews and notify a Telegram group."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "playwright>=1.52,<2",
  "python-dotenv>=1.0,<2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
maps-review-monitor = "maps_review_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
